# Optional heavy worker. The API and frontend retain their small base images.
# docker compose -f docker-compose.yml -f docker-compose.ocr.yml up -d --build
services:
  backend:
    environment:
      TASKS_EAGER: "false"
      INLINE_SCHEDULER: "false"
  worker:
    mem_limit: 2500m
    cpus: 2
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    environment:
      OCR_PROVIDER: hybrid
      OCR_MODEL_CACHE: /data/ocr-models
      OCR_ALLOW_MODEL_DOWNLOADS: "false"
      OMP_NUM_THREADS: "1"
      TASKS_EAGER: "false"
    command: celery -A app.worker worker -B --loglevel=INFO --concurrency=1 --pool=solo
